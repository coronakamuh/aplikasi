name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Macrondroit-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Laporkan error build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|What went wrong|Execution failed" -A4 build.log | head -80; echo '```'; } > body.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Build gagal $(date -u +%F-%H%M)" --body-file body.txt
